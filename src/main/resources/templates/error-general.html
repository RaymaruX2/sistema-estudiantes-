<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<div class="auth-wrap">
    <div class="text-center" style="max-width:520px">
        <i class="bi bi-exclamation-circle-fill text-primary" style="font-size:4rem;"></i>
        <h2 class="mt-3" th:text="${titulo}">No se pudo completar</h2>
        <p class="text-muted" th:text="${mensaje}">Ocurrió un problema.</p>
        <div class="d-flex justify-content-center gap-2">
            <a href="javascript:history.back()" class="btn btn-light border"><i class="bi bi-arrow-left"></i> Volver</a>
            <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Ir al inicio</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
