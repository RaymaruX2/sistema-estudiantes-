<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Apoderados')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('apoderados')}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar('Apoderados', 'Padres, madres y tutores responsables.')}"></header>
        <main class="page">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div><h1>Apoderados</h1><p>Listado y búsqueda de responsables.</p></div>
                <a th:href="@{/apoderados/nuevo}" class="btn btn-primary btn-lg px-3"><i class="bi bi-person-plus-fill"></i> Nuevo Apoderado</a>
            </div>

            <form method="get" class="filter-card">
                <div class="row g-2 align-items-end">
                    <div class="col-md-10">
                        <input name="q" th:value="${q}" class="form-control" placeholder="Buscar por DNI, nombre, apellido o teléfono..."/>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100"><i class="bi bi-search"></i> Buscar</button>
                    </div>
                </div>
            </form>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>DNI</th><th>Nombres y apellidos</th><th>Parentesco</th>
                            <th>Teléfono</th><th>Email</th><th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${apoderados.totalElements == 0}">
                            <td colspan="6" class="text-center text-muted py-5"><i class="bi bi-inbox fs-3 d-block mb-2"></i> Sin resultados</td>
                        </tr>
                        <tr th:each="a : ${apoderados.content}">
                            <td class="text-muted" th:text="${a.dni}"></td>
                            <td class="fw-semibold"><a th:href="@{/apoderados/{id}(id=${a.id})}" class="text-reset" th:text="${a.nombreCompleto}"></a></td>
                            <td><span class="chip chip-grade" th:text="${a.parentesco}"></span></td>
                            <td th:text="${a.telefono}"></td>
                            <td th:text="${a.email} ?: '—'"></td>
                            <td class="text-end">
                                <a th:href="@{/apoderados/{id}(id=${a.id})}" class="btn-icon" title="Ver hijos, pagos y asistencias"><i class="bi bi-eye"></i></a>
                                <a th:href="@{/apoderados/{id}/editar(id=${a.id})}" class="btn-icon" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/apoderados/{id}/eliminar(id=${a.id})}" method="post" class="d-inline js-confirm"
                                      data-confirm="También se eliminarán sus pagos y asistencias, y sus hijos quedarán sin apoderado.">
                                    <button class="btn-icon danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center px-3 py-3 border-top" th:if="${apoderados.totalPages > 1}">
                    <a class="btn btn-sm btn-outline-secondary" th:classappend="${apoderados.first} ? 'disabled'"
                       th:href="@{/apoderados(q=${q},page=${apoderados.number - 1})}"><i class="bi bi-chevron-left"></i> Anterior</a>
                    <span class="small text-muted">Página <span th:text="${apoderados.number + 1}"></span> de <span th:text="${apoderados.totalPages}"></span></span>
                    <a class="btn btn-sm btn-outline-secondary" th:classappend="${apoderados.last} ? 'disabled'"
                       th:href="@{/apoderados(q=${q},page=${apoderados.number + 1})}">Siguiente <i class="bi bi-chevron-right"></i></a>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
