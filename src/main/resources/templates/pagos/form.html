<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pago')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('pagos')}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar('Registrar Pago', 'Agregar o actualizar pago')}"></header>
        <main class="page">
            <form th:action="@{/pagos}" th:object="${pago}" method="post" class="card card-body shadow-sm" style="max-width:760px">
                <input type="hidden" th:field="*{id}"/>

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Apoderado *</label>
                        <input type="text" class="form-control mb-2 js-filter-select" data-target="#apoSelectPago"
                               placeholder="Buscar por DNI o nombre..."/>
                        <select th:field="*{apoderado.id}" class="form-select" required id="apoSelectPago">
                            <option value="">-- Seleccionar --</option>
                            <option th:each="a : ${apoderados}" th:value="${a.id}"
                                    th:text="${a.dni + ' - ' + a.nombreCompleto}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Concepto *</label>
                        <select th:field="*{concepto}" class="form-select" required>
                            <option value="">--</option>
                            <option th:each="c : ${conceptos}" th:value="${c}" th:text="${c.label}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Monto *</label>
                        <input th:field="*{monto}" type="number" step="0.01" class="form-control" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Pago *</label>
                        <input th:field="*{fechaPago}" type="date" class="form-control" required/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Estado *</label>
                        <select th:field="*{estado}" class="form-select" required>
                            <option value="">--</option>
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e.label}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Comprobante</label>
                        <input th:field="*{comprobante}" class="form-control" maxlength="100"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descripción *</label>
                        <input th:field="*{descripcion}" class="form-control" required maxlength="255"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observaciones</label>
                        <textarea th:field="*{observaciones}" class="form-control" rows="3" maxlength="500"></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/pagos}" class="btn btn-light border">Cancelar</a>
                    <button class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
