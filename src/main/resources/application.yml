spring:
  application:
    name: sistema-estudiantes

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sistema_estudiantes?useSSL=false&serverTimezone=America/Lima&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: never

  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  # Clave para firmar las sesiones de la API (defínela en producción con APP_TOKEN_SECRET)
  token:
    secret: ${APP_TOKEN_SECRET:}
  # Sitios que pueden usar la API (el frontend en Vercel y el entorno local)
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

logging:
  level:
    org.springframework.security: INFO
    com.feyalegria: DEBUG
