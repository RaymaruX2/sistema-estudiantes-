<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:with="isEgresado=${nivelActivo != null and nivelActivo.name() == 'EGRESADO'},
               showCarrera=${nivelActivo != null and (nivelActivo.name() == 'SECUNDARIA' or nivelActivo.name() == 'EGRESADO')},
               sideKey=${nivelActivo == null ? 'estudiantes' : (nivelActivo.name() == 'EGRESADO' ? 'egresados' : #strings.toLowerCase(nivelActivo.name()))},
               basePath=${nivelActivo == null ? '/estudiantes' : (nivelActivo.name() == 'EGRESADO' ? '/estudiantes/egresados' : '/estudiantes/' + #strings.toLowerCase(nivelActivo.name()))},
               titulo=${nivelActivo == null ? 'Todos los Estudiantes' : (nivelActivo.name() == 'INICIAL' ? 'Gestión de Nivel Inicial' : (nivelActivo.name() == 'PRIMARIA' ? 'Gestión de Nivel Primaria' : (nivelActivo.name() == 'SECUNDARIA' ? 'Gestión de Nivel Secundaria' : 'Egresados (Ex Alumnos)')))}">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(${sideKey})}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar(${titulo}, ${isEgresado} ? 'Administración de la comunidad de graduados y seguimiento técnico.' : 'Administración de estudiantes, grados y secciones de la institución.')}"></header>
        <main class="page">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1 th:text="${titulo}">Estudiantes</h1>
                    <p th:text="${isEgresado}
                        ? 'Seguimiento de exalumnos y sus especialidades técnicas.'
                        : 'Listado, búsqueda y matrícula de estudiantes.'">Listado</p>
                </div>
                <a th:href="@{/estudiantes/nuevo(nivel=${nivelActivo})}" class="btn btn-primary btn-lg px-3">
                    <i class="bi" th:classappend="${isEgresado} ? 'bi-plus-lg' : 'bi-person-plus-fill'"></i>
                    <span th:text="${isEgresado} ? 'Nuevo Egresado' : 'Agregar Estudiante'">Agregar</span>
                </a>
            </div>

            <form method="get" class="filter-card">
                <div class="filter-title"><i class="bi bi-funnel-fill text-primary"></i> Filtros de Búsqueda</div>
                <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label small fw-semibold text-muted">Búsqueda</label>
                        <input name="q" th:value="${q}" class="form-control"
                               placeholder="Apellido, nombre o DNI..."/>
                    </div>
                    <div class="col-md-3" th:if="${nivelActivo == null}">
                        <label class="form-label small fw-semibold text-muted">Nivel</label>
                        <select name="nivel" class="form-select">
                            <option value="">Todos los niveles</option>
                            <option th:each="n : ${niveles}" th:value="${n}" th:text="${n}"
                                    th:selected="${nivel != null and nivel.name() == n.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-2" th:unless="${isEgresado}">
                        <label class="form-label small fw-semibold text-muted">Grado</label>
                        <select name="grado" class="form-select">
                            <option value="">Todos</option>
                            <option th:each="g : ${gradosFiltro}" th:value="${g}" th:text="${@fmt.grado(g)}"
                                    th:selected="${grado == g}"></option>
                        </select>
                    </div>
                    <div class="col-md-2" th:unless="${isEgresado}">
                        <label class="form-label small fw-semibold text-muted">Sección</label>
                        <select name="seccion" class="form-select">
                            <option value="">Todas</option>
                            <option th:each="s : ${seccionesFiltro}" th:value="${s}" th:text="${s}"
                                    th:selected="${seccion == s}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100"><i class="bi bi-search"></i> Aplicar</button>
                    </div>
                </div>
            </form>

            <div class="card shadow-sm">
                <div class="d-flex justify-content-between align-items-center px-3 py-3 border-bottom">
                    <h5 class="mb-0 fw-bold" th:text="${isEgresado} ? 'Lista de Egresados' : 'Lista de Estudiantes'">Listado</h5>
                    <small class="text-muted">Mostrando <span th:text="${estudiantes.numberOfElements}">0</span>
                        de <span th:text="${estudiantes.totalElements}">0</span>
                        <span th:text="${isEgresado} ? 'egresados' : 'alumnos'">registros</span></small>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th th:text="${isEgresado} ? 'Egresado' : 'Nombre Completo'">Nombre</th>
                            <th>DNI / Identificación</th>
                            <th th:unless="${isEgresado}">Grado / Sección</th>
                            <th th:if="${showCarrera}">Carrera Técnica</th>
                            <th th:if="${isEgresado}">Promoción</th>
                            <th th:if="${isEgresado}">Año</th>
                            <th th:unless="${isEgresado}">Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${estudiantes.totalElements == 0}">
                            <td colspan="7" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i> Sin resultados
                            </td>
                        </tr>
                        <tr th:each="e : ${estudiantes.content}">
                            <td>
                                <span class="row-avatar"
                                      th:text="${#strings.toUpperCase(#strings.substring(e.apellidoPaterno,0,1) + #strings.substring(e.apellidoMaterno,0,1))}">AB</span>
                                <a th:href="@{/estudiantes/{id}(id=${e.id})}" class="fw-semibold text-decoration-none"
                                   style="color:var(--ink)" th:text="${e.nombreCompleto}">Nombre</a>
                            </td>
                            <td class="text-muted" th:text="${e.numeroDocumento}">DNI</td>
                            <td th:unless="${isEgresado}">
                                <span class="chip chip-grade" th:text="${@fmt.grado(e.grado) + ' - ' + e.seccion}">Grado</span>
                            </td>
                            <td th:if="${showCarrera}">
                                <span th:if="${e.carreraTecnica != null and !e.carreraTecnica.isEmpty()}"
                                      class="chip chip-career" th:text="${e.carreraTecnica}">Carrera</span>
                                <span th:unless="${e.carreraTecnica != null and !e.carreraTecnica.isEmpty()}"
                                      class="text-muted">—</span>
                            </td>
                            <td th:if="${isEgresado}">
                                <span th:if="${e.promocion != null and !e.promocion.isEmpty()}"
                                      class="chip chip-promo" th:text="${e.promocion}">Promo</span>
                                <span th:unless="${e.promocion != null and !e.promocion.isEmpty()}" class="text-muted">—</span>
                            </td>
                            <td th:if="${isEgresado}" class="text-muted" th:text="${e.anioCursado}">2024</td>
                            <td th:unless="${isEgresado}">
                                <span class="chip"
                                      th:classappend="${e.estadoMatricula.name() == 'DEFINITIVA' ? 'chip-ok' : (e.estadoMatricula.name() == 'PROVISIONAL' ? 'chip-warn' : 'chip-off')}"
                                      th:text="${e.estadoMatricula}">Estado</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/estudiantes/{id}(id=${e.id})}" class="btn-icon" title="Ver"><i class="bi bi-eye"></i></a>
                                <a th:href="@{/estudiantes/{id}/editar(id=${e.id})}" class="btn-icon" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/estudiantes/{id}/eliminar(id=${e.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('¿Eliminar este registro?');">
                                    <button class="btn-icon danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center px-3 py-3 border-top"
                     th:if="${estudiantes.totalPages > 1}">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:classappend="${estudiantes.first} ? 'disabled'"
                       th:href="@{${basePath}(q=${q},grado=${grado},seccion=${seccion},nivel=${nivel},page=${estudiantes.number - 1})}">
                        <i class="bi bi-chevron-left"></i> Anterior</a>
                    <span class="small text-muted">Página <span th:text="${estudiantes.number + 1}"></span>
                        de <span th:text="${estudiantes.totalPages}"></span></span>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:classappend="${estudiantes.last} ? 'disabled'"
                       th:href="@{${basePath}(q=${q},grado=${grado},seccion=${seccion},nivel=${nivel},page=${estudiantes.number + 1})}">
                        Siguiente <i class="bi bi-chevron-right"></i></a>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
