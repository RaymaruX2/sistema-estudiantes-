<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' · Fe y Alegría 3'">Fe y Alegría 3</title>
    <link rel="icon" type="image/jpeg" th:href="@{/images/logo-feyalegria3.jpeg}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/custom.css}"/>
</head>
<body>

<aside th:fragment="sidebar(active)" class="sidebar" id="appSidebar">
    <div class="sidebar-brand">
        <a th:href="@{/}"><img th:src="@{/images/logo-feyalegria3.jpeg}" alt="Fe y Alegría 3"/></a>
        <div class="brand-caption">Gestión Académica</div>
    </div>

    <nav class="sidebar-nav" sec:authorize="hasRole('PADRE')">
        <a th:href="@{/mi-familia}" class="side-link" th:classappend="${active == 'mi-familia'} ? 'active'">
            <i class="bi bi-house-heart-fill"></i> Mi familia
        </a>
    </nav>

    <nav class="sidebar-nav" sec:authorize="hasAnyRole('ADMIN','SECRETARIA')">
        <a th:href="@{/}" class="side-link" th:classappend="${active == 'dashboard'} ? 'active'">
            <i class="bi bi-grid-1x2-fill"></i> Panel de Control
        </a>

        <div class="nav-group-label">Niveles</div>
        <a th:href="@{/estudiantes/inicial}" class="side-link" th:classappend="${active == 'inicial'} ? 'active'">
            <i class="bi bi-emoji-smile"></i> Nivel Inicial
        </a>
        <a th:href="@{/estudiantes/primaria}" class="side-link" th:classappend="${active == 'primaria'} ? 'active'">
            <i class="bi bi-backpack2"></i> Nivel Primaria
        </a>
        <a th:href="@{/estudiantes/secundaria}" class="side-link" th:classappend="${active == 'secundaria'} ? 'active'">
            <i class="bi bi-mortarboard"></i> Nivel Secundaria
        </a>
        <a th:href="@{/estudiantes/egresados}" class="side-link" th:classappend="${active == 'egresados'} ? 'active'">
            <i class="bi bi-patch-check"></i> Egresados (Ex Alumnos)
        </a>

        <div class="nav-group-label">Administración</div>
        <a th:href="@{/estudiantes}" class="side-link" th:classappend="${active == 'estudiantes'} ? 'active'">
            <i class="bi bi-people-fill"></i> Todos los estudiantes
        </a>
        <a th:href="@{/apoderados}" class="side-link" th:classappend="${active == 'apoderados'} ? 'active'">
            <i class="bi bi-person-badge"></i> Apoderados
        </a>
        <a th:href="@{/pagos}" class="side-link" th:classappend="${active == 'pagos'} ? 'active'">
            <i class="bi bi-wallet2"></i> Pagos
        </a>
        <a th:href="@{/asistencias}" class="side-link" th:classappend="${active == 'asistencias'} ? 'active'">
            <i class="bi bi-calendar-check"></i> Asistencias
        </a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}" class="side-link" th:classappend="${active == 'usuarios'} ? 'active'">
            <i class="bi bi-shield-lock"></i> Usuarios
        </a>
    </nav>

    <div class="sidebar-foot">
        <a th:href="@{/}" class="side-link"><i class="bi bi-question-circle"></i> Ayuda</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="side-link w-100 border-0 bg-transparent text-start">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
        </form>
    </div>
</aside>

<header th:fragment="topbar(titulo, subtitulo)" class="topbar">
    <button class="menu-toggle" type="button" onclick="document.getElementById('appSidebar').classList.toggle('open');document.getElementById('sbBackdrop').classList.toggle('show');">
        <i class="bi bi-list"></i>
    </button>
    <div>
        <h1 class="page-title" th:text="${titulo}">Panel</h1>
        <p class="page-sub" th:if="${subtitulo}" th:text="${subtitulo}"></p>
    </div>

    <form class="topbar-search" method="get" th:action="@{/estudiantes}" sec:authorize="hasAnyRole('ADMIN','SECRETARIA')">
        <i class="bi bi-search"></i>
        <input type="text" name="q" placeholder="Buscar estudiante o DNI..."/>
    </form>

    <a sec:authorize="hasAnyRole('ADMIN','SECRETARIA')" th:href="@{/estudiantes/egresados}" class="topbar-icon" title="Egresados"><i class="bi bi-bell"></i></a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}" class="topbar-icon" title="Configuración"><i class="bi bi-gear"></i></a>

    <div class="topbar-user">
        <span class="avatar" th:text="${#authentication != null ? #strings.toUpperCase(#strings.substring(#authentication.name,0,1)) : 'A'}">A</span>
        <div class="d-none d-md-block">
            <div class="u-name" sec:authentication="name">usuario</div>
            <div class="u-role" sec:authentication="principal.authorities">ROLE</div>
        </div>
    </div>
</header>

<div th:fragment="flash">
    <div th:if="${msg}" id="flashMsg" th:attr="data-msg=${msg}" style="display:none"></div>
    <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMsg}"></span>
    </div>
</div>

<div th:fragment="scripts">
    <div class="sidebar-backdrop" id="sbBackdrop"
         onclick="document.getElementById('appSidebar').classList.remove('open');this.classList.remove('show');"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var flash = document.getElementById('flashMsg');
            if (flash && flash.dataset.msg) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: flash.dataset.msg,
                    showConfirmButton: false,
                    timer: 3000,
                    timerProgressBar: true
                });
            }

            document.querySelectorAll('input.js-filter-select').forEach(function (inp) {
                var sel = document.querySelector(inp.dataset.target);
                if (!sel) return;
                inp.addEventListener('input', function () {
                    var q = inp.value.toLowerCase().trim();
                    var primera = null;
                    Array.prototype.forEach.call(sel.options, function (opt) {
                        if (!opt.value) { opt.hidden = false; return; }
                        var coincide = opt.text.toLowerCase().indexOf(q) !== -1;
                        opt.hidden = q !== '' && !coincide;
                        if (coincide && primera === null) primera = opt;
                    });
                    if (q !== '') sel.value = primera ? primera.value : '';
                });
            });

            document.querySelectorAll('form.js-confirm').forEach(function (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    Swal.fire({
                        title: '¿Estás seguro?',
                        text: form.dataset.confirm || 'Esta acción no se puede deshacer',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#6c757d',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    }).then(function (result) {
                        if (result.isConfirmed) form.submit();
                    });
                });
            });
        });
    </script>
</div>

</body>
</html>
