<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="text-center mb-4">
            <img class="auth-logo" th:src="@{/images/logo-feyalegria3.jpeg}" alt="Fe y Alegría 3"/>
            <h2 class="auth-brand-title mt-3 mb-0">Fe y Alegría 3</h2>
            <p class="text-muted">Sistema de Gestión Académica</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4 p-sm-5">
                <div th:if="${param.error}" class="alert alert-danger py-2 d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos
                </div>
                <div th:if="${param.pendiente}" class="alert alert-warning py-2 d-flex align-items-center gap-2">
                    <i class="bi bi-hourglass-split"></i> Tu cuenta aún no fue aprobada por un administrador
                </div>
                <div th:if="${registroOk}" class="alert alert-success py-2 d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${registroOk}"></span>
                </div>
                <div th:if="${param.logout}" class="alert alert-info py-2 d-flex align-items-center gap-2">
                    <i class="bi bi-info-circle-fill"></i> Sesión cerrada correctamente
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-muted">Correo o usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input name="username" class="form-control" placeholder="ejemplo@feya.edu.pe" required autofocus/>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-muted">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock-fill"></i></span>
                            <input name="password" type="password" class="form-control" placeholder="••••••••" required/>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">
                        Ingresar <i class="bi bi-box-arrow-in-right"></i>
                    </button>
                </form>
                <p class="text-center small mt-3 mb-0">¿No tienes cuenta?
                    <a th:href="@{/registro}" class="fw-bold">Regístrate aquí</a>
                </p>
            </div>
        </div>

        <p class="text-center text-muted small mt-4 mb-0">
            <i class="bi bi-question-circle"></i> Ayuda &nbsp;·&nbsp;
            <i class="bi bi-globe"></i> Web Institucional
        </p>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
