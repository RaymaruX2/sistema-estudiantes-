<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Apoderado')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('apoderados')}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar(${d.apoderado.nombreCompleto}, 'Ficha del apoderado')}"></header>
        <main class="page">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div>
                    <h1 th:text="${d.apoderado.nombreCompleto}">Apoderado</h1>
                    <p>
                        <span class="chip chip-grade" th:text="${d.apoderado.parentesco}"></span>
                        &nbsp;DNI <span th:text="${d.apoderado.dni}"></span>
                        &nbsp;·&nbsp;<i class="bi bi-telephone"></i> <span th:text="${d.apoderado.telefono}"></span>
                        <span th:if="${d.apoderado.email}">&nbsp;·&nbsp;<i class="bi bi-envelope"></i> <span th:text="${d.apoderado.email}"></span></span>
                    </p>
                    <p class="small text-muted mb-0" th:if="${d.apoderado.direccion}">
                        <i class="bi bi-geo-alt"></i> <span th:text="${d.apoderado.direccion}"></span>
                    </p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/apoderados}" class="btn btn-light border"><i class="bi bi-arrow-left"></i> Volver</a>
                    <a th:href="@{/apoderados/{id}/editar(id=${d.apoderado.id})}" class="btn btn-primary"><i class="bi bi-pencil"></i> Editar</a>
                </div>
            </div>

            <div th:replace="~{fragments/familia :: contenido(${d}, true)}"></div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
