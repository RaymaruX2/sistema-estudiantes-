<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar(${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario', 'Cuenta de acceso al sistema')}"></header>
        <main class="page">
            <form th:action="@{/usuarios}" th:object="${usuario}" method="post" class="card card-body shadow-sm" style="max-width:640px">
                <input type="hidden" th:field="*{id}"/>

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Usuario *</label>
                    <input th:field="*{username}" class="form-control" required maxlength="60" th:readonly="${usuario.id != null}"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre completo *</label>
                    <input th:field="*{nombreCompleto}" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input th:field="*{email}" type="email" class="form-control"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol *</label>
                    <select th:field="*{rol}" class="form-select" required id="rolSelect">
                        <option value="">--</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="mb-3" id="bloqueApoderado">
                    <label class="form-label">Apoderado vinculado * <small class="text-muted">(solo para rol PADRE)</small></label>
                    <input type="text" class="form-control mb-2 js-filter-select" data-target="#apoSelectUsuario"
                           placeholder="Buscar apoderado por DNI o nombre..."/>
                    <select name="apoderado" class="form-select" id="apoSelectUsuario">
                        <option value="">-- Ninguno --</option>
                        <option th:each="a : ${apoderados}" th:value="${a.id}"
                                th:selected="${usuario.apoderado != null and usuario.apoderado.id == a.id}"
                                th:text="${a.dni + ' - ' + a.nombreCompleto}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña <small class="text-muted">(mínimo 8 caracteres)</small>
                        <small class="text-muted" th:if="${usuario.id != null}">(vacío = no cambiar)</small>
                    </label>
                    <input name="password" type="password" class="form-control" autocomplete="new-password"/>
                </div>
                <div class="form-check mb-3">
                    <input th:field="*{activo}" type="checkbox" class="form-check-input" id="activo"/>
                    <label class="form-check-label" for="activo">Usuario activo</label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/usuarios}" class="btn btn-light border">Cancelar</a>
                    <button class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    (function () {
        var rol = document.getElementById('rolSelect'), bloque = document.getElementById('bloqueApoderado');
        function actualizar() { bloque.style.display = rol.value === 'PADRE' ? '' : 'none'; }
        rol.addEventListener('change', actualizar);
        actualizar();
    })();
</script>
</body>
</html>
