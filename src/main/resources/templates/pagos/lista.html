<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pagos')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('pagos')}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar('Pagos', 'Control y registro de pagos de cuotas.')}"></header>
        <main class="page">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="page-head">
                <div><h1>Pagos</h1><p>Gestión de pagos y cuotas de apoderados.</p></div>
                <a th:href="@{/pagos/nuevo}" class="btn btn-primary btn-lg px-3"><i class="bi bi-plus-circle-fill"></i> Nuevo Pago</a>
            </div>

            <form method="get" class="filter-card">
                <div class="row g-2 align-items-end">
                    <div class="col-md-7">
                        <input name="q" th:value="${q}" class="form-control" placeholder="Buscar por apoderado, DNI o descripción..."/>
                    </div>
                    <div class="col-md-3">
                        <select name="estado" class="form-select">
                            <option value="">Todos los estados</option>
                            <option th:each="e : ${estados}" th:value="${e}" th:text="${e.label}" th:selected="${estado == e}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100"><i class="bi bi-search"></i> Buscar</button>
                    </div>
                </div>
            </form>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Apoderado</th>
                            <th>Fecha</th>
                            <th>Descripción</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${pagos.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-5"><i class="bi bi-inbox fs-3 d-block mb-2"></i> Sin resultados</td>
                        </tr>
                        <tr th:each="p : ${pagos}">
                            <td class="fw-semibold" th:text="${p.apoderado.nombreCompleto}"></td>
                            <td class="text-muted" th:text="${p.fechaPago}"></td>
                            <td th:text="${p.descripcion}"></td>
                            <td class="fw-semibold" th:text="${'S/ ' + #numbers.formatDecimal(p.monto, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td><span class="badge" th:classappend="${'text-bg-' + p.estado.bootstrap}" th:text="${p.estado.label}"></span></td>
                            <td class="text-end">
                                <a th:href="@{/pagos/{id}/editar(id=${p.id})}" class="btn-icon" title="Editar"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/pagos/{id}/eliminar(id=${p.id})}" method="post" class="d-inline js-confirm" data-confirm="Se eliminará este pago">
                                    <button class="btn-icon danger" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="d-flex justify-content-between align-items-center px-3 py-3 border-top" th:if="${pagos.totalPages > 1}">
                    <a class="btn btn-sm btn-outline-secondary" th:classappend="${pagos.first} ? 'disabled'"
                       th:href="@{/pagos(q=${q},estado=${estado},page=${pagos.number - 1})}"><i class="bi bi-chevron-left"></i> Anterior</a>
                    <span class="small text-muted">Página <span th:text="${pagos.number + 1}"></span> de <span th:text="${pagos.totalPages}"></span>
                        · <span th:text="${pagos.totalElements}"></span> registros</span>
                    <a class="btn btn-sm btn-outline-secondary" th:classappend="${pagos.last} ? 'disabled'"
                       th:href="@{/pagos(q=${q},estado=${estado},page=${pagos.number + 1})}">Siguiente <i class="bi bi-chevron-right"></i></a>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
