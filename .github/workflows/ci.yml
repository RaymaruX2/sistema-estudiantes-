name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -padmin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cargar scripts SQL
        run: |
          fallo() { ERR=$(tail -15 sql.log | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=SQL $1::$ERR"; exit 1; }
          mysql -h127.0.0.1 -uroot -padmin < sql/01-schema.sql > sql.log 2>&1 || fallo 01
          for f in $(ls sql/*.sql | sort | tail -n +2); do
            echo "Cargando $f"
            mysql -h127.0.0.1 -uroot -padmin sistema_estudiantes < "$f" >> sql.log 2>&1 || fallo "$f"
          done
          # Usuario de prueba con contraseña conocida (solo para CI)
          pip install -q bcrypt
          HASH=$(python3 -c "import bcrypt;print(bcrypt.hashpw(b'Prueba123',bcrypt.gensalt(10)).decode())")
          mysql -h127.0.0.1 -uroot -padmin sistema_estudiantes -e \
            "INSERT INTO usuarios (username, password_hash, nombre_completo, email, rol) VALUES ('ciadmin', '$HASH', 'Admin CI', 'ciadmin@test.pe', 'ADMIN');" >> sql.log 2>&1 || fallo usuario

      - name: Compilar
        run: |
          mvn -B package -DskipTests > build.log 2>&1 || {
            ERR=$(grep -E "\[ERROR\]" build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Compilacion Java::$ERR"
            exit 1
          }

      - name: Iniciar aplicación
        env:
          APP_TOKEN_SECRET: secreto-de-prueba-para-ci-1234567890
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/login; then echo "Arrancó"; exit 0; fi
            sleep 2
          done
          ERR=$(grep -E "ERROR|Exception|Caused by" app.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Arranque::$ERR"
          exit 1

      - name: Pruebas de humo
        run: bash ci/smoke.sh || {
            ERR=$(grep -E "ERROR|Exception|Caused by" app.log | grep -v "DEBUG" | head -20 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Log de la app::$ERR"
            exit 1
          }

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Revisar tipos y compilar
        run: |
          npx tsc --noEmit > tsc.log 2>&1 || {
            ERR=$(head -40 tsc.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=TypeScript::$ERR"
            exit 1
          }
          npm run build > build.log 2>&1 || {
            ERR=$(tail -30 build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Vite build::$ERR"
            exit 1
          }
