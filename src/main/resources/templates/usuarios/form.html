<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>
    <div class="main-area">
        <header th:replace="~{fragments/layout :: topbar(${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario', 'Cuenta de acceso al sistema')}"></header>
        <main class="page">
            <form th:action="@{/usuarios}" th:object="${usuario}" method="post" class="card card-body shadow-sm" style="max-width:640px">
                <input type="hidden" th:field="*{id}"/>

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Usuario *</label>
                    <input th:field="*{username}" class="form-control" required maxlength="60" th:readonly="${usuario.id != null}"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre completo *</label>
                    <input th:field="*{nombreCompleto}" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input th:field="*{email}" type="email" class="form-control"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rol *</label>
                    <select th:field="*{rol}" class="form-select" required>
                        <option value="">--</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña
                        <small class="text-muted" th:if="${usuario.id != null}">(vacío = no cambiar)</small>
                    </label>
                    <input name="password" type="password" class="form-control" autocomplete="new-password"/>
                </div>
                <div class="form-check mb-3">
                    <input th:field="*{activo}" type="checkbox" class="form-check-input" id="activo"/>
                    <label class="form-check-label" for="activo">Usuario activo</label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/usuarios}" class="btn btn-light border">Cancelar</a>
                    <button class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
